version: 1

wine:
  prefix: ".tools/wineprefix"
  headless_prefix: ".tools/wineprefix-headless"
  headless_disc: "build/disc/files"
  minimum_major: 11
  debug_port: 31337
  debug_port_range: [31337, 31399]
  sessions_dir: "build/debug/sessions"
  session_prefix_dir: ".tools/debug-sessions"
  debug_quiet: true
  debug_mute_audio: true
  debug_xvfb: true
  xvfb:
    depth: 16
    server_args:
      - "+extension"
      - GLX
    environment:
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
  virtual_desktop:
    enabled: true
    name: OpenTony
    width: 640
    height: 480
