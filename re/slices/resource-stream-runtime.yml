open_questions:
  - Confirm the backend slot capacity and exact path normalization rules.
  - Confirm the PSX-region backend failure cleanup and the individual stream flag bits.
  - Confirm the count-prefix allocation header used by the platform allocator.

completion:
  - Direct and PKR-backed resource handles expose bounded seek/read/close lifetime.
  - PRE short-name lookup and package/file fallback share one caller-owned load buffer.
  - Stream element reads preserve checked multiplication and cursor advancement.
  - Loaded bytes reach PSX and FNT parsers without retaining backend or PRE storage.
  - Player PSH/PSX requests use the common PKR/PRE handoff and retain one owned runtime result per queue entry.
  - Malformed PKR/PRE player payloads publish no partial result and leave the request retryable.
  - Completed player results have an explicit release boundary matching the observed entry cleanup path.
  - Platform file handles, allocator internals, and asynchronous scheduling remain explicit adapters.
