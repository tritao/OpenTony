  - name: RuntimeCustomParkCell
    size: 0x10
    confidence: confirmed
    description: Expanded custom-park grid cell used by level-generation state.
    fields:
      - offset: 0x00
        name: translated_references
        type: u16[5]
        confidence: confirmed
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x0a
        name: unpacked_cell_values
        type: u8[6]
        confidence: confirmed
        evidence:
          - re/evidence/functions/custom-park-runtime.md

  - name: RuntimeCustomParkDiskItemRecord
    size: 0x24
    confidence: observed
    description: Packed 36-byte PRK item record. The two adjacent item/name bytes differ between the old/current load branches and the serializer.
    fields:
      - offset: 0x00
        name: endpoint_axis_indices
        type: u8[6]
        confidence: confirmed
        description: Two endpoint triplets, stored as three two-byte columns.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x06
        name: packed_nibble_word
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x08
        name: packed_two_bit_word
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x09
        name: legacy_load_item_byte
        type: u8
        confidence: confirmed
        description: Byte read into the expanded runtime item byte by the older 0x4e24 load branch.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x0a
        name: current_or_serialized_item_byte
        type: u8
        confidence: confirmed
        description: Byte read as the item byte by the current 0x4e25 load branch and written there by the serializer; the current loader starts the visible name at the following disk byte +0x0b.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x0b
        name: name_bytes
        type: u8[25]
        confidence: observed
        description: NUL-terminated name payload beginning at the visible text in the PARK0 witness; copied into the expanded runtime name field.
        evidence:
          - re/evidence/functions/custom-park-runtime.md

  - name: RuntimeCustomParkItemRecord
    size: 0x2c
    confidence: confirmed
    description: Expanded 36-byte PRK item record used by level generation.
    fields:
      - offset: 0x00
        name: endpoint_axis_index_0
        type: u8[2]
        confidence: confirmed
        description: First endpoint lookup index; byte 0 is endpoint 0 and byte 1 is endpoint 1. The generator uses it as the first index into the active cell-model table.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x02
        name: endpoint_axis_index_1
        type: u8[2]
        confidence: confirmed
        description: Second endpoint lookup index; byte 2 is endpoint 0 and byte 3 is endpoint 1. It selects the five-entry subrange within the active cell-model table.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x04
        name: endpoint_axis_index_2
        type: u8[2]
        confidence: confirmed
        description: Third endpoint lookup index; byte 4 is endpoint 0 and byte 5 is endpoint 1. The loader diagnostic identifies this index as the Z-side index.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x06
        name: endpoint_two_bit_values
        type: u8[2]
        confidence: confirmed
        description: First two expanded values extracted from the low four bits of disk word +0x08; each runtime byte retains one two-bit value.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x08
        name: expanded_nibble_values
        type: u8[4]
        confidence: confirmed
        description: Four nibbles extracted low-to-high from disk word +0x06.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x0c
        name: packed_item_flags
        type: u8
        confidence: confirmed
        description: Remaining shifted byte from disk word +0x08. It is copied into the generated piece/gap input; individual editor flag meanings remain open.
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x0d
        name: item_name
        type: char[27]
        confidence: observed
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x28
        name: item_byte
        type: u8
        confidence: confirmed
        description: Item byte copied from disk offset +0x0a by the current 0x4e25 load branch. The older 0x4e24 load branch uses disk offset +0x09; the one-byte compatibility quirk is part of the format boundary.
        evidence:
          - re/evidence/functions/custom-park-runtime.md

