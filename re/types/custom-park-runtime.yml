  - name: RuntimeCustomParkDiskCell
    size: 0x08
    confidence: confirmed
    description: Packed custom-park grid cell.
    fields:
      - offset: 0x00
        name: compact_references
        type: u8[5]
        confidence: confirmed
        evidence:
          - re/evidence/functions/custom-park-runtime.md
      - offset: 0x05
        name: packed_two_bit_values
        type: u8
        confidence: confirmed
        evidence:
