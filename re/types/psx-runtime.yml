          - re/evidence/functions/renderer.md
      - offset: 0x08
        name: radius
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x0c
        name: bounds_word_0
        type: i16
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x0e
        name: bounds_word_1
        type: i16
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x10
        name: bounds_word_2
        type: i16
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x12
        name: bounds_word_3
        type: i16
        confidence: confirmed
        evidence:
