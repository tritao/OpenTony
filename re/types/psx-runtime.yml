  - name: RuntimePsxFaceRecord
    size: null
    confidence: observed
    description: Variable-size PSX face record; the loader replaces the disk texture-table index at +0x10 with a shared scene-material pointer for textured faces.
    fields:
      - offset: 0x00
        name: packed_flags_and_length
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/renderer.md
      - offset: 0x04
        name: vertex_indices
        type: array<u8,4>
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x08
        name: gpu_command
        type: u32
        confidence: observed
        evidence:
          - re/evidence/functions/renderer.md
      - offset: 0x0c
        name: normal_index
        type: u16
        confidence: confirmed
        evidence:
