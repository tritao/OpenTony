      - offset: 0x18
        name: unknown_header_word_pair
        type: u32
        confidence: observed
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x02
        name: vertex_count
        type: u16
        confidence: confirmed
        evidence:
