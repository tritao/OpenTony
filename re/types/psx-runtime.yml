version: 1
types:
  - name: RuntimePsxBlockmapCellSourceHeader
    size: 0x0c
    confidence: confirmed
    description: Three-word source cell prefix. The PC zone loader skips the first two words and consumes the third as the object-reference count.
    fields:
      - offset: 0x00
        name: source_cell_word_0
        type: u32
        confidence: observed
        description: Preserved in the disk format but not read by the PC zone loader after the cell walk begins.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x04
        name: source_cell_word_1
        type: u32
        confidence: observed
        description: Preserved in the disk format but not read by the PC zone loader after the cell walk begins.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x08
        name: object_reference_count
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/blockmap-collision.md

  - name: RuntimePsxObjectRecord
    size: 0x4c
    confidence: confirmed
    description: 0x4c-stride environment object record allocated by the PSX parser. The allocation has a four-byte count prefix before record zero.
    fields:
      - offset: 0x08
        name: position_x
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x0c
        name: position_y
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x10
        name: position_z
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x1a
        name: model_index
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/renderer.md
      - offset: 0x1f
        name: psx_slot
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/blockmap-collision.md
          - re/evidence/functions/renderer.md
      - offset: 0x20
        name: next
        type: pointer<RuntimePsxObjectRecord>
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/renderer.md

  - name: RuntimePsxModelPacketHeader
    size: null
