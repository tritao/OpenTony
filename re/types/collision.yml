version: 1

types:
  - name: RuntimeCollisionObject
    kind: fixed_layout
    size: 0x24
    confidence: observed
    description: >-
      Recovered prefix of an object visited by the dynamic and blockmap
      collision paths; later object state is outside this layout.
    fields:
      - offset: 0x06
        name: query_stamp
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x08
        name: position_q12
        type: array<q12_i32,3>
        confidence: confirmed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x14
        name: rotation
        type: array<i16,3>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1a
        name: model_index
        type: u16
        confidence: confirmed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x1f
        name: model_region_slot
        type: u8
        confidence: confirmed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x20
        name: collision_next
        type: pointer<RuntimeCollisionObject>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: SColCache
    kind: fixed_layout
    size: 0x10
    confidence: confirmed
    description: >-
      One of the 20 reusable model-cache slots scanned by 0x004638d0 at
      DAT_00567a70 with a 0x10-byte stride.
    fields:
      - offset: 0x00
        name: item
        type: pointer<RuntimeCollisionObject>
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x04
        name: model
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x08
        name: face_count
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x0c
        name: face_cache_base_index
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]

  - name: SFaceCache
    kind: fixed_layout
    size: 0x1c
    confidence: confirmed
    description: >-
      One of the 500 shared world-space face flags/AABB records written by
      the collision cell walker at DAT_005643b0.
    fields:
      - offset: 0x00
        name: packed_face_word
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x04
        name: bounds_min_x
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x08
        name: bounds_min_y
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x0c
        name: bounds_min_z
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x10
        name: bounds_max_x
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x14
        name: bounds_max_y
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x18
        name: bounds_max_z
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
  - name: CollisionModelDataHeader
    kind: fixed_layout
    size: 0x1c
    confidence: confirmed
    description: >-
      Packed model-data header followed by 8-byte vertex records, 8-byte
      normal records, and variable-length face records. The counts and
      record bases are directly consumed by the PC face walker.
    fields:
      - offset: 0x00
        name: unknown_flags
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x02
        name: vertex_count
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: normal_count
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x06
        name: face_count
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: radius
        type: u32
        confidence: provisional
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0c
        name: bounds
        type: array<i16,6>
        confidence: provisional
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x18
        name: unknown_value
        type: u32
        confidence: provisional
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionVertexRecord
    kind: fixed_layout
    size: 0x08
    confidence: confirmed
    description: three signed 16-bit model components plus a 16-bit padding word
    fields:
      - offset: 0x00
        name: x
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x02
        name: y
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: z
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x06
        name: padding
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionFacePrefix
    kind: fixed_layout
    size: 0x10
    confidence: confirmed
    description: >-
      First 16 bytes of a variable-length face record. The encoded upper
      halfword is the byte stride; the static walker reaches the same value
      as 4 * (word0 >> 18) because records are four-byte aligned.
    fields:
      - offset: 0x00
        name: base_flags
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x02
        name: length_bytes
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: vertex_indices
        type: array<u8,4>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: render_payload
        type: array<u8,4>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0c
        name: normal_index_shifted
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0e
        name: surface_flags
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionModelCacheEntry
    kind: fixed_layout
    size: 0x10
    confidence: confirmed
    description: >-
      One of the 20 reusable model-cache slots at DAT_00567a70.
    fields:
      - offset: 0x00
        name: model
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: model_data
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: face_count
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0c
        name: face_aabb_start
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionFaceAabbRecord
    kind: fixed_layout
    size: 0x1c
    confidence: confirmed
    description: low-16-bit face flags followed by min/max X/Y/Z bounds
    fields:
      - offset: 0x00
        name: base_flags
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: min_x
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: min_y
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0c
        name: min_z
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x10
        name: max_x
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x14
        name: max_y
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x18
        name: max_z
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionFaceCache
    kind: fixed_layout
    size: 0x36b0
    confidence: confirmed
    description: >-
      Shared 500-entry face-AABB working cache at DAT_005643b0. The storage
      capacity is bounded by the 0x00463580 allocator helper and each entry
      has the 0x1c-byte CollisionFaceAabbRecord layout.
    fields:
      - offset: 0x00
        name: entries
        type: array<SFaceCache,500>
        confidence: confirmed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionModelCache
    kind: fixed_layout
    size: 0x140
    confidence: confirmed
    description: >-
      Twenty-entry rotating model cache at DAT_00567a70, scanned by
      0x004638d0 in 0x10-byte steps.
    fields:
      - offset: 0x00
        name: entries
        type: array<SColCache,20>
        confidence: confirmed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionZoneGridRecord
    kind: fixed_layout
    size: 0x20
    confidence: confirmed
    description: >-
      Collision-facing prefix of one 0x660-byte zone-table record at
      DAT_00567f80 + zone_index*0x660. The remaining bytes in the stride are
      not typed here.
    fields:
      - offset: 0x00
        name: present
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: min_x
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: min_z
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0c
        name: max_x
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x10
        name: max_z
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x14
        name: cell_divisor
        type: i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1c
        name: cell_count_x
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1e
        name: cell_count_z
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: SLineInfo
    kind: fixed_layout
    aliases:
      - CollisionLineQuery
    size: 0x90
    confidence: provisional
    description: >-
      Caller-owned fixed-point line-query record used by the PC collision
      path. The original PSX symbol database names the corresponding family
      SLineInfo/SHit; the observed PC fields occupy 0x90 bytes, with explicit
      unknown gaps retained in the native layout view.
    fields:
      - offset: 0x00
        name: start_x
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: start_y
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: start_z
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x0c
        name: end_x
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x10
        name: end_y
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x14
        name: end_z
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x18
        name: bounds_min_x
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1c
        name: bounds_min_y
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x20
        name: bounds_min_z
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x24
        name: bounds_max_x
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x28
        name: bounds_max_y
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x2c
        name: bounds_max_z
        type: q12_i32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x40
        name: hit_distance
        type: i32
        confidence: observed
        description: distance from start along the line, in integer line units
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x44
        name: line_length
        type: i32
        confidence: observed
        description: integer length used to convert hit_parameter to distance
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x48
        name: line_basis
        type: array<array<i16,3>,3>
        confidence: confirmed
        description: >-
          Nine contiguous signed 16-bit fields copied by 0x004638d0 to
          DAT_006a3e10 through DAT_006a3e20; 0x004624d0 constructs the basis.
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x68
        name: hit_body
        type: pointer<RuntimeCollisionObject>
        confidence: observed
        description: null until the nearest accepted candidate is stored
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x6c
        name: hit_position
        type: array<q12_i32,3>
        confidence: observed
        description: segment-plane intersection point, integer-truncated
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x78
        name: hit_normal
        type: array<i16,3>
        confidence: inferred
        description: finalized signed Q12-like normal/basis vector
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x80
        name: hit_face_record
        type: pointer<void>
        confidence: observed
        description: winning model/cache face record; flags are read at +0xc
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x84
        name: hit_model_index
        type: u16
        confidence: observed
        description: model/item index copied from the tested model record
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x88
        name: query_mask_mode
        type: u8
        confidence: inferred
        description: enables otherwise-filtered collision flag class when nonzero
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x89
        name: direction_flag
        type: u8
        confidence: inferred
        description: initialized by the degenerate vertical-line setup branch
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x8a
        name: query_stamp
        type: u16
        confidence: observed
        description: traversal/cache stamp written by query preparation
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x8c
        name: hit_parameter
        type: i32
        confidence: observed
        description: nearest segment parameter in 0..0x4000 fixed scale
        evidence: [re/evidence/functions/collision.md]

  - name: LinkedCollisionObjectPrefix
    kind: fixed_layout
    size: 0x24
    confidence: confirmed
    description: >-
      Collision-facing prefix of the heap-linked object record traversed by
      0x004628f0. The cull admission test uses only the low flag byte; the
      high-byte bit 0x02 (full-word 0x0200) is consumed later when selecting
      the matrix-scaling transform path. Full-word 0x0400 is written by an
      unrelated appearance setter and is not assigned collision meaning here.
      The complete allocation may contain additional fields.
    fields:
      - offset: 0x04
        name: flags
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x06
        name: query_stamp
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: position
        type: array<i32,3>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x14
        name: angles
        type: array<i16,3>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1a
        name: model_index
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1f
        name: model_kind
        type: u8
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x20
        name: next
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionCandidateHeadArrayEntry
    kind: fixed_layout
    size: 0x04
    confidence: confirmed
    description: >-
      One 32-bit entry in the null-terminated per-cell array walked by
      0x004638d0; the pointer names the head of a linked collision-object
      list. The array allocation and pointed-to heap ownership remain open.
    fields:
      - offset: 0x00
        name: object_head
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: CollisionCandidateCellSourceHeader
    kind: fixed_layout
    size: 0x0c
    confidence: confirmed
    description: >-
      Intermediate per-cell level-loader block observed by 0x004667e0. The
      entry count is at +0x08; raw entries begin at +0x0c and are followed by
      a zero terminator. The first two words remain unknown.
    fields:
      - offset: 0x00
        name: unknown_00
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x04
        name: unknown_04
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: entry_count
        type: u32
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: LinkedCollisionObjectListLinks
    kind: fixed_layout
    size: 0x38
    confidence: confirmed
    description: >-
      Partial linked-list view established by the 0x004801d0 insertion and
      0x004801f0 removal primitives. Bytes between the two links are not
      typed and this is not the complete heap allocation.
    fields:
      - offset: 0x20
        name: next
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x28
        name: matrix_scale_x_q12
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x2a
        name: matrix_scale_y_q12
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x2c
        name: matrix_scale_z_q12
        type: i16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x34
        name: previous
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]

  - name: LinkedCollisionObjectElement
    kind: fixed_layout
    size: 0x4c
    confidence: confirmed
    description: >-
      Full element stride emitted by the level-building allocation path:
      count*0x4c+4 bytes with the element array beginning after the leading
      count word. The collision prefix and list links are typed. Words at
      +0x28/+0x2a/+0x2c are signed Q12 matrix-scale factors consumed by
      0x004f5540 when the high-byte 0x02 flag is set; the remaining tail
      fields are opaque.
    fields:
      - offset: 0x04
        name: flags
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x06
        name: query_stamp
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x08
        name: position
        type: array<i32,3>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x14
        name: angles
        type: array<i16,3>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1a
        name: model_index
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x1f
        name: model_kind
        type: u8
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x20
        name: next
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x34
        name: previous
        type: pointer<void>
        confidence: observed
        evidence: [re/evidence/functions/collision.md]
