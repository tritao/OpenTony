      - offset: 0x8a
        name: query_stamp
        type: u16
        confidence: observed
        description: traversal/cache stamp written by query preparation
        evidence: [re/evidence/functions/collision.md]
      - offset: 0x8c
        name: hit_parameter
        type: i32
        confidence: observed
        description: nearest segment parameter in 0..0x4000 fixed scale
        evidence: [re/evidence/functions/collision.md]
