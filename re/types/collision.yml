    fields:
      - offset: 0x06
        name: query_stamp
        type: u16
        confidence: observed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x08
        name: position_q12
        type: array<q12_i32,3>
        confidence: confirmed
        evidence: [re/evidence/functions/blockmap-collision.md]
      - offset: 0x14
        name: rotation
        type: array<i16,3>
        confidence: observed
