  - name: RuntimeCharacterTrickConfig
    kind: fixed_layout
    size: 0x104
    confidence: confirmed
    description: Per-character runtime trick configuration returned by the global character-index mapper; TRICKS.BIN population uses this fixed 0x104-byte stride.
    fields:
      - offset: 0x08
        name: remaining_trick_points
        type: u32
        confidence: confirmed
        description: Decremented by the trick-cost consumer before setting a trick bit.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x34
        name: available_trick_mask
        type: u32
        confidence: confirmed
        description: Initialized to 1 or 0x3ff according to the character/set flags.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x38
        name: trick_costs
        type: array<u8,10>
        confidence: confirmed
        description: Ten per-character cost bytes copied from the static character metadata table.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0xac
        name: trick_unlock_bits
        type: array<u32,8>
        confidence: observed
        description: Bitfield storage used by the runtime trick consumer; the observed helper addresses indices through 0x7f.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0xcc
        name: assignable_trick_indices
        type: array<u8,53>
        confidence: confirmed
        description: Button-combination slots populated from TRICKS.BIN; unset entries use 0xff.
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeCreateTextureRecord
    kind: fixed_layout
    size: 0x1c
    confidence: confirmed
    description: Individual texture record allocated while parsing CRETEX.BIN.
    fields:
      - offset: 0x00
        name: record_word_0
        type: u32
        confidence: observed
        description: First copied word of the parser's 0x1c-byte input tuple; its semantic role varies by caller and is not yet named.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x04
        name: record_word_1
        type: u32
        confidence: observed
        description: Second copied word of the parser's input tuple; its semantic role is not yet named.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x08
        name: texture_name
        type: array<char,16>
        confidence: confirmed
        description: Inline NUL-terminated name key compared by the texture database lookup and normalized before insertion.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x18
        name: record_flag_0
        type: u8
        confidence: observed
        description: Parser sets this byte for one optional texture role; the remaining tail bytes are copied but not semantically named.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x19
        name: record_tail
        type: array<u8,3>
        confidence: observed
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeTextureSetRecord
    kind: fixed_layout
    size: 0x44
