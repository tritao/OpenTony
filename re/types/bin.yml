version: 1
types:
  - name: RuntimeTricksSectionPointers
    kind: fixed_layout
    confidence: observed
    description: Seven globals published by the TRICKS.BIN loader; each points into one raw loaded buffer.
    fields:
      - offset: 0x00
        name: section_0
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x04
        name: section_1
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x08
        name: section_2
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x0c
        name: section_3
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x10
        name: section_4
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x14
        name: section_5
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x18
        name: section_6
        type: pointer<void>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeTextureSetManagerPrefix
    kind: fixed_layout
    size: 0x6608
    confidence: confirmed
    description: CRETEX texture-set manager prefix. It owns 0x180 inline 0x44-byte set records beginning at +0x04 and publishes the committed count at +0x6604.
    fields:
      - offset: 0x04
        name: texture_sets
        type: array<RuntimeTextureSetRecord,384>
        confidence: confirmed
        description: Inline set records; the ID lookup walks this array with a 0x44-byte stride.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x6604
        name: texture_set_count
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeCreateTextureManagerPrefix
    kind: fixed_layout
    size: 0x408
    confidence: confirmed
    description: CRETEX individual-texture database prefix. It stores a sorted pointer array followed by its count.
    fields:
      - offset: 0x04
        name: textures_by_name
        type: array<pointer<RuntimeCreateTextureRecord>,256>
        confidence: confirmed
        description: Sorted pointers to allocated 0x1c-byte texture records.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x404
        name: texture_count
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeCreateAppearanceContext
    kind: fixed_layout
    confidence: observed
    description: Proven create/customization appearance-state slice populated from CRETEX texture records; the complete surrounding object is not yet typed.
    fields:
      - offset: 0x04
        name: streaming_or_spooler_mode
        type: u32
        confidence: observed
        description: Nonzero selects the spooler/streaming appearance branch in the texture-name apply helper; zero uses direct bitmap loading.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x70
        name: selected_body_part_group_indices
        type: array<u32,3>
        confidence: confirmed
        description: Indices returned by the source part-name lookup for the three create body-group cases; written at +0x70, +0x74, and +0x78.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x80
        name: group4_secondary_texture_absent
        type: u32
        confidence: observed
        description: Group-4 preview state receives the inverse of texture-set flag +0x41 here.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x8c
        name: part_palette_buffers
        type: array<pointer<void>,9>
        confidence: observed
        description: Per-part palette-buffer pointers consumed by the create texture-animation and palette helpers.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x140
        name: part_palette_handles
        overlay_group: appearance_handles
        type: array<pointer<void>,9>
        confidence: confirmed
        description: Per-part palette/material handles; 0x00422460 writes the handle resolved from the selected texture checksum here.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x1f8
        name: pelvis_palette_handle
        type: pointer<void>
        confidence: observed
        description: Additional palette handle used when the pelvis/part-2 texture path is active.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x144
        name: group0_secondary_runtime_handle
        overlay_group: appearance_handles
        type: pointer<void>
        confidence: observed
        description: Secondary group-0 appearance handle; the consumer clears it when set flag +0x41 is zero.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x150
        name: group1_secondary_runtime_handle
        overlay_group: appearance_handles
        type: pointer<void>
        confidence: observed
        description: Secondary group-1 appearance handle; the consumer clears it when set flag +0x41 is zero.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x288
        name: applied_part_texture_names
        type: array<array<char,16>,9>
        confidence: confirmed
        description: Nine 16-byte inline names, one per create texture part; 0x004221a0 compares and updates the selected slot.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x318
        name: part_texture_animation_bytes
        type: array<u8,4>
        confidence: observed
        description: Bytes read by the texture-animation update for parts 1, 2, 3, and 6; their public animation semantics remain open.
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeTrickManagerPrefix
    kind: fixed_layout
    size: 0x140c
    confidence: confirmed
    description: "Fixed prefix of the TRICKS runtime manager: inline trick records, record count, and the loaded raw resource pointer."
    fields:
      - offset: 0x04
        name: trick_records
        type: array<RuntimeTrickRecord,128>
        confidence: confirmed
        description: Fixed 0x28-byte records appended by the GTricks parser.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x1404
        name: trick_count
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x1408
        name: raw_tricks_resource
        type: pointer<void>
        confidence: confirmed
        description: Successful result of the one-time TRICKS.BIN loader retained by the manager.
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeTrickDescriptor
    kind: variable_record
    confidence: observed
    description: Variable-length descriptor in the GTricks section; the stream data and fixed trick record remain separate.
    fields:
      - offset: 0x00
        name: prefix_count
        type: u16
        confidence: confirmed
        description: The executable validates 1..4 and uses this value as the index of the type word.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: prefix_words
        type: sequence<u16>
        confidence: observed
        description: Prefix words between the count and type; their complete button encoding remains open.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: trick_type
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: data_offset
        type: i16
        confidence: confirmed
        description: Signed offset added to the raw TRICKS.BIN base.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: descriptor_word
        type: u16
        confidence: confirmed
        description: Raw word following the signed data offset; the executable propagates selected bits as flags.
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeTrickRecord
    kind: fixed_layout
    size: 0x28
    confidence: confirmed
    description: Fixed runtime database record appended by the GTricks parser.
    fields:
      - offset: 0x00
        name: name
        type: array<char,32>
        confidence: confirmed
        description: NUL-terminated name copied with a maximum length below 32 bytes.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x20
        name: source_data_offset
        type: u16
        confidence: confirmed
        description: 16-bit source offset and duplicate-lookup key.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x22
        name: decoded_q_value
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x24
        name: table_class_flags
        type: u16
        confidence: confirmed
        description: Receives the type-selected table class and propagated flag bits.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x26
        name: descriptor_flags
        type: u16
        confidence: confirmed
        description: Receives the raw descriptor word and drives duplicate/listed flag propagation.
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeTrickKeyTableEntry
    kind: variable_record
    size: null
    confidence: confirmed
    description: Variable-length per-player trick-selection entry materialized from TRICKS.BIN key data.
    fields:
      - offset: 0x00
        name: button_count
        type: u16
        confidence: confirmed
        description: Number of button words; the executable accepts 1 through 4 and uses zero as the table terminator.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x02
        name: button_codes
        type: sequence<u16>
        confidence: confirmed
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: source_data_offset
        type: i16
        confidence: confirmed
        description: Signed offset added to the loaded TRICKS.BIN base when the selected script is parsed or started.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: descriptor_flags
        type: u16
        confidence: confirmed
        description: Descriptor/selection flags copied from the matched RuntimeTrickRecord.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: variable
        name: next_entry
        type: RuntimeTrickKeyTableEntry
        confidence: confirmed
        description: Entry begins after the flags word; a zero button_count terminates the sequence.
        evidence:
          - re/evidence/functions/bin-runtime.md

  - name: RuntimeSkaterTrickScriptState
    kind: fixed_layout
    confidence: observed
    description: Trick-script state fields embedded in the gameplay skater object after a TRICKS.BIN script is selected.
    fields:
      - offset: 0xf4
        name: trick_animation_frame
        type: u16
        confidence: confirmed
        description: Current script-controlled animation frame; commands 0x01, 0x09, 0x0d, 0x10, 0x18, and 0x48 read or write it.
        evidence:
          - re/evidence/functions/bin-runtime.md
          - re/evidence/functions/animation-runtime.md
      - offset: 0xf6
        name: trick_animation_index
        type: u16
        confidence: confirmed
        description: Animation index selected by command 0x01 and consumed by the normal animation path.
        evidence:
          - re/evidence/functions/bin-runtime.md
          - re/evidence/functions/animation-runtime.md
      - offset: 0xf8
        name: trick_animation_mode
        type: u8
        confidence: confirmed
        description: Script writes modes 0, 2, 3, and 4 here through commands 0x13, 0x14, 0x18, and 0x1c.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x100
        name: trick_animation_direction
        type: i8
        confidence: confirmed
        description: Command 0x03 negates this direction before swapping animation range fields.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x101
        name: trick_animation_range_start
        type: i8
        confidence: confirmed
        description: One endpoint of the script-controlled animation frame range.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x107
        name: trick_animation_hold_flag
        type: u8
        confidence: confirmed
        description: Cleared by command 0x03 and consulted by frame-gated commands 0x0d, 0x10, and 0x48.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x29cc
        name: trick_script_cursor
        type: pointer<u8>
        confidence: confirmed
        description: Resolved TRICKS.BIN script pointer consumed by the trick-script interpreter.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x29c8
        name: trick_script_runtime_state
        type: u32
        confidence: confirmed
        description: Set when a selected script starts and cleared by the script terminator/reset paths.
        evidence:
          - re/evidence/functions/bin-runtime.md
      - offset: 0x29c0
        name: trick_script_value
        type: u16
        confidence: observed
        description: Script command 0x0a writes this value; the public meaning is not assigned.
