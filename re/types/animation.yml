version: 1
types:
  - name: RuntimeAnimationTable
    kind: fixed_layout
    size: null
    confidence: confirmed
    description: Runtime animation table derived from a PSX animation resource.
    fields:
      - offset: 0x00
        name: animation_count
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/animation-runtime.md
      - offset: 0x08
        name: animation_records
        type: sequence<RuntimeAnimationRecord>
        confidence: confirmed
        evidence:
          - re/evidence/functions/animation-runtime.md

  - name: RuntimeAnimationRecord
    kind: fixed_layout
    size: 0x08
    confidence: confirmed
    description: Fixed-stride source/runtime record selected by animation index. The decompression path treats the two words as a source offset/pointer and frame-count/stream-length metadata.
    fields:
      - offset: 0x00
        name: source_offset_or_pointer
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/animation-runtime.md
      - offset: 0x04
        name: frame_count_or_stream_length
        type: u32
        confidence: confirmed
        description: Frame-count/stream-length value consumed by the compressed-frame decoder and adjacent interpolation path. The intermediate compact-table interpretation of the playback byte read remains open.
        evidence:
          - re/evidence/functions/animation-runtime.md

  - name: RuntimeAnimationDecompressedChannelFrame
    size: 0x0c
    confidence: confirmed
    description: Six signed 16-bit channel samples decoded for one model part and animation frame.
    fields:
      - offset: 0x00
        name: channel_words
        type: array<i16, 6>
        confidence: confirmed
        description: Six consecutive channel samples written by Animation_DecompressStream; rotation/translation order is not assigned.
        evidence:
          - re/evidence/functions/animation-runtime.md

  - name: RuntimeAnimationPoseJoint
    size: 0x18
    confidence: confirmed
    description: Per-part pose record returned by animation decompression and used by pose/hook position consumers.
    fields:
      - offset: 0x00
        name: basis_matrix
        type: array<i16, 9>
        confidence: observed
        description: 3x3 fixed-point basis written by the pose builder or inherited from decompressed pose data.
        evidence:
          - re/evidence/functions/animation-runtime.md
      - offset: 0x12
        name: world_position_x
        type: i16
        confidence: confirmed
        evidence:
          - re/evidence/functions/animation-runtime.md
      - offset: 0x14
        name: world_position_y
        type: i16
        confidence: confirmed
        evidence:
          - re/evidence/functions/animation-runtime.md
      - offset: 0x16
        name: world_position_z
        type: i16
        confidence: confirmed
        evidence:
          - re/evidence/functions/animation-runtime.md

  - name: RuntimeAnimationLinkPoseRecord
    size: 0x0c
    confidence: observed
    description: Six-word per-link record allocated by the links-packet reader; individual link/pose meanings are not yet assigned.
    fields:
      - offset: 0x00
        name: link_words
        type: array<i16, 6>
        confidence: observed
        evidence:
          - re/evidence/functions/animation-runtime.md

  - name: RuntimePlayerHookPacketRecord
    size: 0x08
    confidence: observed
    description: Four-word hook record exposed by the static player hook-packet table. The first three signed words are passed unchanged to the hook-transform helper; the final word selects the animation part.
    fields:
      - offset: 0x00
        name: hook_transform_word_0
        type: i16
        confidence: observed
        description: Copied to the hook-transform input globals; its axis/vector meaning is not independently assigned.
        evidence:
          - re/evidence/functions/skater-asset-runtime.md
          - re/evidence/functions/animation-runtime.md
      - offset: 0x02
        name: hook_transform_word_1
        type: i16
        confidence: observed
        description: Copied to the hook-transform input globals; its axis/vector meaning is not independently assigned.
        evidence:
          - re/evidence/functions/skater-asset-runtime.md
          - re/evidence/functions/animation-runtime.md
      - offset: 0x04
        name: hook_transform_word_2
        type: i16
        confidence: observed
        description: Copied to the hook-transform input globals; its axis/vector meaning is not independently assigned.
        evidence:
          - re/evidence/functions/skater-asset-runtime.md
          - re/evidence/functions/animation-runtime.md
      - offset: 0x06
        name: animation_part_index
        type: i16
        confidence: confirmed
        description: Part index selected by M3D_GetPartPosition and M3D_GetHookPosition after the hook packet is bound.
        evidence:
          - re/evidence/functions/animation-runtime.md
          - re/evidence/functions/skater-asset-runtime.md

  - name: RuntimePlayerHookPacketTemplate
    size: 0x14
    confidence: observed
    description: Static player hook-packet template selected by object +0x2cc0 and bound through M3D_ReadHooksPacket.
    fields:
      - offset: 0x00
        name: packet_header
        type: array<u16, 2>
        confidence: observed
        description: Four-byte packet prefix; its semantic fields are not assigned.
        evidence:
          - re/evidence/functions/skater-asset-runtime.md
      - offset: 0x04
        name: hook_records
        type: array<RuntimePlayerHookPacketRecord, 2>
        confidence: observed
        evidence:
          - re/evidence/functions/skater-asset-runtime.md

