version: 1
types:
  - name: RuntimePsxBlockmapCellSourceHeader
    kind: fixed_layout
    size: 0x0c
    confidence: confirmed
    description: Three-word source cell prefix. The PC zone loader skips the first two words and consumes the third as the object-reference count.
    fields:
      - offset: 0x00
        name: source_cell_word_0
        type: u32
        confidence: observed
        description: Preserved in the disk format but not read by the PC zone loader after the cell walk begins.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x04
        name: source_cell_word_1
        type: u32
        confidence: observed
        description: Preserved in the disk format but not read by the PC zone loader after the cell walk begins.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x08
        name: object_reference_count
        type: u32
        confidence: confirmed
        evidence:
          - re/evidence/functions/blockmap-collision.md

  - name: RuntimePsxObjectRecord
    kind: fixed_layout
    size: 0x4c
    confidence: confirmed
    description: 0x4c-stride environment object record allocated by the PSX parser. The allocation has a four-byte count prefix before record zero.
    fields:
      - offset: 0x00
        name: vtable_or_record_dispatch
        type: pointer<void>
        confidence: confirmed
        description: Parser-installed vtable pointer; the first entry is called by region teardown and record cleanup resets it to 0x00519388.
        evidence:
          - re/evidence/functions/psx-lifecycle.md
      - offset: 0x04
        name: object_flags
        type: u32
        confidence: confirmed
        description: Low and high flag halves copied from the disk object record; finalization also sets a derived bit in the high byte.
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x08
        name: position_x
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x0c
        name: position_y
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x10
        name: position_z
        type: i32
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x14
        name: rotation_component_x
        type: i16
        confidence: confirmed
        description: Low 16 bits of disk object word +0x10; the collision face test rejects objects when the three components at +0x14/+0x16/+0x18 are nonzero.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x16
        name: rotation_component_y
        type: i16
        confidence: confirmed
        description: High 16 bits of disk object word +0x10.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x18
        name: rotation_component_z
        overlay_group: rotation_or_feature_flags
        type: i16
        confidence: confirmed
        description: Disk object word +0x14 copied as the third collision-tested transform component.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x1a
        name: model_index
        type: u16
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/renderer.md
      - offset: 0x1f
        name: psx_slot
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/blockmap-collision.md
          - re/evidence/functions/renderer.md
      - offset: 0x19
        name: model_feature_flags
        overlay_group: rotation_or_feature_flags
        type: u8
        confidence: confirmed
        description: Finalization sets bit 0x20 here when the selected model header carries bit 0x10.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x24
        name: source_rgbx_word
        type: u32
        confidence: observed
        description: Fourth trailing word copied from the 36-byte disk object record; its public meaning remains open.
        evidence:
          - re/evidence/functions/asset-loading.md
      - offset: 0x28
        name: transform_scale_x
        type: i16
        confidence: observed
        description: Constructor initializes this transform component to 0x1000; later semantic use remains open.
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x2a
        name: transform_scale_y
        type: i16
        confidence: observed
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x2c
        name: transform_scale_z
        type: i16
        confidence: observed
        evidence:
          - re/evidence/functions/blockmap-collision.md
      - offset: 0x20
        name: next
        type: pointer<RuntimePsxObjectRecord>
        confidence: confirmed
        evidence:
          - re/evidence/functions/asset-loading.md
          - re/evidence/functions/renderer.md

