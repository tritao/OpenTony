  - name: RuntimePsxPostModelTagHeader
    kind: fixed_layout
    size: 0x08
    confidence: confirmed
    description: Common eight-byte header for optional PSX post-model products. The parser dispatches the payload by tag_type and bounds it with payload_size.
    fields:
      - offset: 0x00
        name: tag_type
        type: u32
        confidence: confirmed
        description: Runtime dispatch value; recognized products include blockmap, texture-WIB, colour-pulse, animation metadata, vertex-colour/BITS, hierarchy, and RGBS.
        evidence:
          - re/evidence/functions/psx-tags-runtime.md
      - offset: 0x04
        name: payload_size
        type: u32
        confidence: confirmed
        description: Payload byte count consumed by the common parser's bounded post-model walk.
        evidence:
          - re/evidence/functions/psx-tags-runtime.md

  - name: RuntimePsxColourPulseList
    kind: fixed_layout
    size: null
    confidence: confirmed
    description: Variable-size type-7 colour-pulse list. The consumer mutates the current interval index and elapsed interval, then writes an interpolated colour to the slot RGBS table.
    fields:
      - offset: 0x00
        name: rgbs_colour_index
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/psx-tags-runtime.md
      - offset: 0x01
        name: interval_count
        type: u8
        confidence: confirmed
        evidence:
          - re/evidence/functions/psx-tags-runtime.md
      - offset: 0x02
        name: current_interval
        type: u8
        confidence: confirmed
        description: Current RGB interval selected by the frame-time update.
        evidence:
          - re/evidence/functions/psx-tags-runtime.md
      - offset: 0x03
        name: elapsed_interval_units
        type: u8
        confidence: confirmed
        description: Elapsed units within the current interval; the update carries excess units into subsequent intervals.
        evidence:
          - re/evidence/functions/psx-tags-runtime.md
      - offset: 0x04
        name: intervals
        type: sequence<RuntimePsxColourPulseInterval>
        confidence: confirmed
        evidence:
