version: 1

experiments:
  - name: warehouse-idle
    status: planned
    purpose: Establish stable player object/state while stationary in Warehouse.
    capture:
      - frame
      - player_position
      - player_velocity
      - player_state
      - player_animation

  - name: warehouse-run
    status: planned
    purpose: Establish horizontal movement update and acceleration/velocity behavior.

  - name: warehouse-ollie
    status: planned
    purpose: Capture crouch, ollie launch, apex, descent, landing, state transitions, and animation.

  - name: warehouse-animation
    status: complete
    purpose: Recover the skater animation selector, cursor timing, resource identity, and skeleton-pose boundary.
    capture:
      - animation_selector
      - animation_requests
      - animation_cursor
      - animation_resource
      - skeleton_pose_boundary
